name: Build Android app

# Runs on every change to main, and on demand (Actions > Build Android app > Run workflow).
# Result: an installable .apk and a Google Play .aab, attached to a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key from repository secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing — the app is signed with a temporary debug key and cannot be updated later."
          fi

      - name: Build APK and App Bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect files
        id: out
        run: |
          VER=$(grep '^versionName=' app.properties | cut -d= -f2 | tr -d '[:space:]').${{ github.run_number }}
          PKG=$(grep '^packageId=' app.properties | cut -d= -f2 | tr -d '[:space:]')
          URL=$(grep '^siteUrl=' app.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/school-app-$VER.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/school-app-$VER.aab"
          if [ -n "$KEYSTORE_PATH" ]; then
            SHA=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep 'SHA256:' | sed 's/.*SHA256: //')
          else SHA="(debug key)"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          {
            echo "## แอป Android เวอร์ชัน $VER"
            echo "- ลิงก์ระบบ: $URL"
            echo "- Package ID: \`$PKG\`"
            echo "- SHA-256: \`$SHA\`"
            echo ""
            echo "นำ Package ID และ SHA-256 ไปกรอกที่ ตั้งค่าระบบ > แอป Android เพื่อให้แอปเปิดเต็มจอ"
            echo "ดาวน์โหลดไฟล์ .apk ได้ที่หน้า Releases ของ repository นี้"
          } | tee -a "$GITHUB_STEP_SUMMARY" > dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: school-app-${{ steps.out.outputs.ver }}
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.out.outputs.ver }}
          name: แอป Android v${{ steps.out.outputs.ver }}
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/*.aab
